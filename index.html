<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- На телефоне: без масштабирования страницы пальцами (стол сам управляет жестами) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1b" />
    <title>Тренажёр русского бильярда</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Тренажёр русского бильярда</h1>
      <div class="toggle">
        <button id="btn-mode-shoot" class="active">Удар</button>
        <button id="btn-mode-arrange">Расстановка</button>
        <button id="btn-mode-pyramid">Пирамида</button>
      </div>
      <div class="buttons">
        <button id="btn-view">3D (V)</button>
        <span id="cam-buttons" class="buttons" hidden>
          <button id="btn-cam-cue" title="Камера за кием, после удара следит за шарами">Авто-камера (C)</button>
          <button id="btn-cam-overview" title="Свободная камера: вид со стороны дома">Обзор</button>
          <button id="btn-cam-top" title="Свободная камера: вид сверху">Сверху</button>
        </span>
        <button id="btn-lock">Зафиксировать кий (Пробел)</button>
        <span id="training-buttons" class="buttons">
          <button id="btn-repeat">Повторить удар (R)</button>
          <button id="btn-clear">Очистить стол</button>
          <button id="btn-reset">Начальная расстановка</button>
        </span>
      </div>
    </header>
    <main>
      <!-- Два холста друг на друге: снизу 3D (WebGL), сверху 2D.
           В 3D-режиме верхний холст прозрачный: на нём только полоска силы,
           а ещё он ловит мышь для удара и камеры. -->
      <div id="stage">
        <canvas id="gl" hidden></canvas>
        <canvas id="table"></canvas>
        <!-- Только на телефоне: ползунок силы, доводка прицела, кнопка панели -->
        <div id="power-slider" class="touch-only"><div class="fill"></div><span>Сила</span></div>
        <div id="fine-aim" class="touch-only">
          <button id="aim-left" aria-label="Повернуть кий влево">◀</button>
          <button id="aim-right" aria-label="Повернуть кий вправо">▶</button>
        </div>
        <button id="btn-panel" class="mobile-only">☰ Панель</button>
      </div>
      <aside>
        <section id="game-panel" hidden>
          <h2>Свободная пирамида</h2>
          <div class="score">
            <div><span>Ты</span><b id="score-player">0</b></div>
            <div class="sep">:</div>
            <div><span>Соперник</span><b id="score-opponent">0</b></div>
          </div>
          <p class="hint">До 8 очков. Соперник получает очко за каждый твой фол.</p>
          <table class="stats">
            <tr><td>Ударов</td><td id="stat-shots">0</td></tr>
            <tr><td>Фолов</td><td id="stat-fouls">0</td></tr>
            <tr><td>Промахов</td><td id="stat-misses">0</td></tr>
            <tr><td>Шаров на столе</td><td id="stat-left">16</td></tr>
          </table>
          <p id="game-message"></p>
          <button id="btn-new-game">Новая партия</button>
          <hr />
        </section>

        <h2>Точка удара</h2>
        <canvas id="spin" width="160" height="160"></canvas>
        <p id="spin-label"></p>
        <label class="elev">
          Подъём кия: <b id="elev-val">0°</b>
          <input type="range" id="elev" min="0" max="80" step="1" value="0" />
        </label>
        <p class="hint">
          Щёлкни или тяни точку по шару.<br />
          Вверх — накат, вниз — оттяжка, вбок — винт.<br />
          Двойной щелчок — в центр.
        </p>

        <label class="check">
          <input type="checkbox" id="chk-predict" checked />
          Траектория при натяге (T)
        </label>
        <div class="sound-row">
          <label class="check">
            <input type="checkbox" id="chk-sound" checked />
            Звук
          </label>
          <input type="range" id="vol" min="0" max="100" value="70" title="Громкость" />
        </div>

        <section id="training-panel">
        <h2>Упражнения</h2>
        <div class="save-row">
          <input id="ex-name" type="text" placeholder="Название" maxlength="40" />
          <button id="btn-save">Сохранить</button>
        </div>
        <ul id="ex-list"></ul>
        <div class="file-row">
          <button id="btn-export">В файл</button>
          <button id="btn-import">Из файла</button>
          <input id="file-import" type="file" accept=".json,application/json" hidden />
        </div>
        </section>
      </aside>
    </main>
    <footer id="status"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
