# Автосборка и публикация на GitHub Pages.
# Каждый раз, когда изменения попадают в ветку main, GitHub сам:
#   1) скачивает код, 2) ставит библиотеки, 3) собирает игру (npm run build),
#   4) выкладывает папку dist как сайт.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # можно запустить вручную на вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
